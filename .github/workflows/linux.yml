name: C/C++ CI Linux

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo DEBIAN_FRONTEND=noninteractive apt -y install bison autoconf-archive libmagic-dev

        git clone https://github.com/microsoft/vcpkg.git --depth 1
        pushd vcpkg
        ./bootstrap-vcpkg.sh
        popd
  
    - name: Configure
      run: |
        export VCPKG_ROOT=$PWD/vcpkg
        export PATH=$VCPKG_ROOT:$PATH
        cmake --preset=vcpkg \
              -DMINT_COPY_MODULE_SOURCES_TO_BUILD_DIR=ON \
              -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: |
        cmake --build build

    - name: Run tests
      working-directory: ./build
      run: ctest

    - name: Run library tests
      env:
        MINT_LIBRARY_PATH: ${{ github.workspace }}/build/out/lib/mint
      run: ${{ github.workspace }}/build/out/bin/mint ./tests
